<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tanotes Modern</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --accent: #7aa2f7;
            --glass: rgba(26, 27, 38, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text: #c0caf5;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 0;
            overflow: hidden; height: 100vh;
        }

        .page {
            display: none;
            padding: 20px;
            height: calc(100vh - 100px);
            overflow-y: auto;
            animation: fadeIn 0.3s ease-out;
        }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-weight: 300; letter-spacing: 1px; color: #fff; margin-bottom: 25px; }

        .note {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
        }
        .note .cat { font-size: 10px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .note .time { font-size: 9px; opacity: 0.4; display: block; margin-top: 10px; }

        .glass-input {
            width: 100%; background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 14px; color: #fff;
            padding: 14px; margin-bottom: 15px; font-size: 16px;
            box-sizing: border-box; outline: none;
        }
        .glass-input:focus { border-color: var(--accent); }

        .save-btn {
            background: var(--accent); color: var(--bg);
            border: none; width: 100%; padding: 16px;
            border-radius: 14px; font-weight: bold; font-size: 16px;
        }

        .nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(16, 18, 26, 0.8); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid var(--border);
        }
        .nav-btn { text-align: center; font-size: 11px; opacity: 0.5; transition: 0.3s; cursor: pointer; }
        .nav-btn.active { opacity: 1; color: var(--accent); }
        .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }

        .del-btn { color: #f7768e; float: right; font-size: 12px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

    <div id="p-list" class="page active">
        <h2>Архив записей</h2>
        <div id="list-container"></div>
    </div>

    <div id="p-add" class="page">
        <h2>Новая заметка</h2>
        <select id="i-cat" class="glass-input">
            <option>💼 Работа</option>
            <option>🌌 Астрономия</option>
            <option>💡 Идеи</option>
            <option>🏠 Личное</option>
        </select>
        <textarea id="i-text" class="glass-input" rows="8" placeholder="О чем думаешь?"></textarea>
        <button class="save-btn" onclick="saveNote()">Сохранить</button>
    </div>

    <nav class="nav">
        <div class="nav-btn active" onclick="show('p-list', this)">
            <span class="nav-icon">📁</span>Заметки
        </div>
        <div class="nav-btn" onclick="show('p-add', this)">
            <span class="nav-icon">➕</span>Добавить
        </div>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // ТВОЯ АКТУАЛЬНАЯ ССЫЛКА NGROK
        const API = "https://venomously-criminative-frank.ngrok-free.dev"; 

        function show(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'p-list') loadNotes();
            tg.HapticFeedback.impactOccurred('light');
        }

        async function loadNotes() {
            try {
                const res = await fetch(`${API}/notes`);
                const notes = await res.json();
                const cont = document.getElementById('list-container');
                cont.innerHTML = notes.map(n => `
                    <div class="note">
                        <span class="del-btn" onclick="deleteNote(${n.id})">Удалить</span>
                        <span class="cat">${n.category}</span>
                        <div style="color: #fff; line-height: 1.5;">${n.content}</div>
                        <span class="time">${n.created_at}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Ошибка API");
            }
        }

        async function deleteNote(id) {
            if(!confirm("Удалить запись?")) return;
            tg.HapticFeedback.notificationOccurred('warning');
            await fetch(`${API}/delete/${id}`);
            loadNotes();
        }

        function saveNote() {
            const text = document.getElementById('i-text').value;
            const cat = document.getElementById('i-cat').value;
            if(!text) return;

            const data = { category: cat, text: text };
            tg.sendData(JSON.stringify(data));
            
            document.getElementById('i-text').value = '';
            tg.HapticFeedback.notificationOccurred('success');
            show('p-list', document.querySelectorAll('.nav-btn')[0]);
        }

        loadNotes();
    </script>
</body>
</html>
